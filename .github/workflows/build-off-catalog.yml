name: OFF-Katalog bauen (CH/DE/AT)
on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Kommagetrennt: switzerland,germany,austria"
        required: true
        default: "switzerland,germany,austria"
      max_products:
        description: "Maximale Produktzahl (nach Popularität geschnitten, Standard 80000)"
        required: true
        default: "80000"
      source:
        description: "parquet = OFF food.parquet via DuckDB (empfohlen), dump = JSONL-Dump (13 GB, langsam), api = REST (limitiert)"
        required: true
        default: "parquet"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Dump-Modus streamt ~7 GB gzip und filtert zeilenweise vor
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Katalog bauen (Dump oder API)
        env:
          CATALOG_SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$CATALOG_SOURCE" = "dump" ]; then EXTRA="--prefer-dump"; fi
          if [ "$CATALOG_SOURCE" = "parquet" ]; then
            pip install -q "duckdb==2.0.0"
            df -h / | tail -1
            # Einmaliger Komplett-Download (8 GB) statt vieler Range-Requests (HuggingFace: HTTP 429)
            curl -sSL --fail --retry 6 --retry-delay 30 --retry-all-errors \
              -A "NutriSnap-CatalogBuilder/1.0" \
              -o food.parquet \
              "https://huggingface.co/datasets/openfoodfacts/product-database/resolve/main/food.parquet"
            ls -l food.parquet
            EXTRA="--parquet food.parquet"
          fi
          python3 scripts/build_off_catalog.py \
            --countries "${{ inputs.countries }}" \
            --max "${{ inputs.max_products }}" \
            $EXTRA \
            --out app/src/main/assets/off_catalog.jsonl.gz \
            2>&1 | tee off_catalog.log
          # Harte Mindestgrösse: Dump braucht echten Bestand, API mindestens > Seed
          python3 - <<'PY' 2>&1 | tee -a off_catalog.log
          import gzip, os, sys
          path = "app/src/main/assets/off_catalog.jsonl.gz"
          with gzip.open(path, "rt", encoding="utf-8") as f:
              n = sum(1 for _ in f)
          source = os.environ.get("CATALOG_SOURCE", "dump")
          min_n = 2000 if source in ("dump", "parquet") else 500
          print(f"Zeilen im Katalog: {n} (Quelle={source}, Minimum={min_n})")
          if n < min_n:
              sys.exit(f"Katalog zu klein ({n} < {min_n}) – Abbruch ohne Commit")
          PY
      - name: Commit result
        run: |
          set -euo pipefail
          git config user.email "severin@nutrisnap.dev"
          git config user.name "Severin Sonderegger"
          git add app/src/main/assets/off_catalog.jsonl.gz
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            # Nochmals prüfen, damit ein leerer Seed nie gepusht wird
            N=$(python3 -c "import gzip;print(sum(1 for _ in gzip.open('app/src/main/assets/off_catalog.jsonl.gz','rt',encoding='utf-8')))")
            if [ "$N" -lt 500 ]; then
              echo "Commit abgebrochen: Katalog hat nur $N Zeilen"
              exit 1
            fi
            git commit -m "OFF-Katalog aktualisiert (${{ inputs.countries }}, max ${{ inputs.max_products }}, ${N} Produkte)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push-Versuch $i fehlgeschlagen, erneut..."
              sleep 5
            done
            git status -sb
          fi
      - name: Fehlerlog ins Repo (nur bei Fehlschlag)
        if: failure()
        run: |
          git config user.email "severin@nutrisnap.dev"
          git config user.name "Severin Sonderegger"
          { echo "Run ${{ github.run_id }} (${{ inputs.source }}, ${{ inputs.countries }}, max ${{ inputs.max_products }})"; \
            tail -n 120 off_catalog.log 2>/dev/null || echo "kein Log vorhanden"; } > off_catalog_error.txt
          git add off_catalog_error.txt
          git commit -m "ci: OFF-Katalog Fehlerlog (Run ${{ github.run_id }})" || true
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
      - name: Kurzbericht als Annotation (immer)
        if: always()
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open("off_catalog.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lines = ["kein Log"]
          keep = [l for l in lines if re.search(r"Dump|Fehler|HTTP|Zeilen|FERTIG|Stop|Seite 1:|OFF meldet|Land:|Baue", l)]
          msg = "\n".join(keep[-25:] or lines[-15:]).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::notice title=OFF-Katalog::" + msg[:9000])
          PY
