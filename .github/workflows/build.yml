name: Build APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Verhindert, dass Gradle-Caches die Actions-Storage-Quota zuballern.
          cache-cleanup: on-success
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Unit Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          NUTRITIONIX_APP_ID: ${{ secrets.NUTRITIONIX_APP_ID }}
          NUTRITIONIX_API_KEY: ${{ secrets.NUTRITIONIX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee test_output.log; exit ${PIPESTATUS[0]}
      - name: Build Debug APK
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
          NUTRITIONIX_APP_ID: ${{ secrets.NUTRITIONIX_APP_ID }}
          NUTRITIONIX_API_KEY: ${{ secrets.NUTRITIONIX_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log; exit ${PIPESTATUS[0]}
      - name: Sign APK with stable keystore
        if: success()
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD || 'nutrisnap123' }}
        run: |
          UNSIGNED=app/build/outputs/apk/debug/app-debug.apk
          ${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | sort -V | tail -1)/apksigner sign \
            --ks app/nutrisnap-debug.keystore \
            --ks-pass "pass:${KEYSTORE_PASS}" \
            --key-pass "pass:${KEYSTORE_PASS}" \
            --ks-key-alias nutrisnap-debug \
            $UNSIGNED
          echo "APK signed with stable keystore"
      - name: Upload errors to repo
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          python3 - <<'PYEOF'
          import urllib.request, urllib.error, json, base64, os

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPO']
          run_num = os.environ['RUN_NUM']

          KEYWORDS = [
              'e: ', 'error:', 'Unresolved reference', 'Cannot find',
              'cannot find', 'FAILED', 'unresolved', 'not found',
              'None of the following', 'Overload resolution', 'Type mismatch',
              'Val cannot be reassigned', 'Expecting', 'Compilation error',
              'is not defined', 'is not a member'
          ]

          def read_log(path):
              try:
                  with open(path, 'r', errors='replace') as f:
                      return f.readlines()
              except FileNotFoundError:
                  return None

          # WICHTIG: nicht nur build_output.log lesen. Wenn "Unit Tests" fehlschlaegt,
          # wird "Build Debug APK" uebersprungen und build_output.log existiert nie -
          # dann wuerde dieses Skript sonst mit FileNotFoundError abstuerzen, bevor
          # es committen kann, und build_errors.txt bliebe auf einem alten Stand haengen.
          sources = [
              ('Unit Tests (test_output.log)', 'test_output.log'),
              ('Build Debug APK (build_output.log)', 'build_output.log'),
          ]

          parts = [f"# Build errors - run {run_num}\n\n"]
          any_log_found = False
          for name, path in sources:
              lines = read_log(path)
              if lines is None:
                  parts.append(f"## {name}\n_Log nicht vorhanden (Schritt uebersprungen oder nicht ausgefuehrt)._\n\n")
                  continue
              any_log_found = True
              error_lines = [l for l in lines if any(k in l for k in KEYWORDS)]
              parts.append(
                  f"## {name} - Error lines\n```\n" +
                  "".join(error_lines[-80:]) +
                  "```\n\n" +
                  f"## {name} - Last 150 lines\n```\n" +
                  "".join(lines[-150:]) +
                  "```\n\n"
              )

          if not any_log_found:
              parts.append("Keine Log-Datei gefunden - Fehler ist vermutlich vor der Test-/Build-Ausfuehrung aufgetreten (z.B. Gradle-Konfigurationsfehler).\n")

          content = "".join(parts)
          encoded = base64.b64encode(content.encode()).decode()

          api_url = f"https://api.github.com/repos/{repo}/contents/build_errors.txt"

          def get_sha():
              req = urllib.request.Request(api_url, headers={"Authorization": f"token {token}"})
              try:
                  existing = json.load(urllib.request.urlopen(req))
                  return existing['sha']
              except Exception:
                  return None

          # Bei parallelen Sessions/Runs kann die SHA veraltet sein (409). Direkt vor
          # jedem PUT frisch abrufen und bei Konflikt erneut versuchen.
          for attempt in range(5):
              file_sha = get_sha()
              payload = {"message": f"ci: errors run {run_num}", "content": encoded}
              if file_sha:
                  payload["sha"] = file_sha

              put_req = urllib.request.Request(
                  api_url,
                  data=json.dumps(payload).encode(),
                  headers={"Authorization": f"token {token}", "Content-Type": "application/json"},
                  method="PUT"
              )
              try:
                  resp = json.load(urllib.request.urlopen(put_req))
                  print("Committed:", resp.get('commit', {}).get('sha', 'unknown')[:12])
                  break
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')
                  if e.code == 409 and attempt < 4:
                      print(f"SHA-Konflikt (Versuch {attempt + 1}/5), retry...")
                      continue
                  print(f"Upload fehlgeschlagen ({e.code}):", body)
                  break
          PYEOF
      - name: Publish APK + log via GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Actions-Artifact-Storage ist quota-limitiert (0.5 GB/Monat auf Free-Plan).
          # Releases zaehlen nicht dagegen, daher liefern wir die APK darueber aus.
          TAG="debug-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --title "Debug Build #${{ github.run_number }}" \
            --notes "Automatischer Debug-Build von commit ${{ github.sha }}" \
            app/build/outputs/apk/debug/app-debug.apk \
            build_output.log
